{{ $src := .Get "src" | default (.Get "url") | default (.Get 0) }}
{{ $text := .Get "text" | default (.Get 1) | default "Télécharger le PDF" }}
{{ $downloadName := .Get "download" | default (.Get "name") }}
{{ $url := cond (hasPrefix $src "http") $src ($src | relURL) }}

<a href="{{ $url }}" {{ with $downloadName }}download="{{ . }}"{{ else }}download{{ end }} target="_blank" rel="noopener noreferrer" style="
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background-color: #e53935;
  color: #ffffff;
  padding: 10px 18px;
  border-radius: 8px;
  font-weight: 600;
  text-decoration: none;
  font-size: 14px;
  line-height: 1;
">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
    <polyline points="14 2 14 8 20 8"></polyline>
    <line x1="12" y1="18" x2="12" y2="12"></line>
    <polyline points="9 15 12 18 15 15"></polyline>
  </svg>
  <span>{{ $text }}</span>
</a>
